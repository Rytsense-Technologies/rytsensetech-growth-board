<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Growth Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap');
  :root { --accent:#0e7a82; --accent-ink:#075258; --line:#e2e5ea; --ink:#12181f; --soft:#4b5563; }
  html, body { margin: 0; min-height: 100%; background: #f5f6f8; color: var(--ink); font-family: "Source Sans 3", system-ui, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  main { width: min(400px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; box-shadow: 0 8px 24px -12px rgba(18,24,31,.12); }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(155deg, var(--accent), var(--accent-ink)); color: #fff; font-family: Manrope, sans-serif; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; }
  h1 { font-family: Manrope, sans-serif; font-size: 22px; margin: 0 0 6px; }
  p { font-size: 13px; color: var(--soft); margin: 0 0 16px; }
  label { display: block; font-size: 12px; font-weight: 600; margin: 12px 0 4px; }
  input, button { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); font: inherit; }
  button { margin-top: 16px; background: var(--accent); color: #fff; border: 0; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.7; cursor: wait; }
  #msg { min-height: 1.2em; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark">RT</span><strong>Rytsense Growth Board</strong></div>
  <h1>Sign in</h1>
  <p>Team login. This browser stays signed in until you sign out.</p>
  <label for="user">Username</label>
  <input id="user" autocomplete="username" value="rytsensetech">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">
  <button id="go" type="button">Sign in</button>
  <p id="msg"></p>
</main>
<script src="assets/app-config.js"></script>
<script src="assets/live-api.js"></script>
<script>
(function () {
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');
  var cfg = window.GB_CONFIG || {};
  var DEFAULT_API = (cfg.apiBase || (location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? 'http://localhost:8787'
    : 'https://rytsensetech-growth-board.onrender.com')).replace(/\/$/, '');

  function get(key) {
    try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
  }
  function set(key, value) {
    try { if (value) localStorage.setItem(key, value); } catch (e) {}
  }
  function apiBase() {
    return (get('gb-api-base') || DEFAULT_API).replace(/\/$/, '');
  }
  function nextPage() {
    try {
      var next = new URLSearchParams(location.search).get('next') || '';
      if (next && next.indexOf('://') < 0 && next.indexOf('//') !== 0) {
        if (next.charAt(0) === '/' || /^\w[\w.-]*\.html(\?|#|$)/.test(next)) return next;
      }
    } catch (e) {}
    return 'index.html';
  }
  function finish(data, username) {
    if (window.GbLive && window.GbLive.saveSession) window.GbLive.saveSession(data);
    else {
      set('gb-access-token', data.access_token);
      set('gb-refresh-token', data.refresh_token);
    }
    set('gb-email', username || (data.user && data.user.email) || 'rytsensetech');
    set('gb-api-base', apiBase());
    location.replace(nextPage());
  }
  async function readJson(res) {
    try { return await res.json(); } catch (e) { return {}; }
  }

  (async function () {
    var refresh = get('gb-refresh-token');
    if (!refresh) return;
    msg.textContent = 'Signing you in…';
    try {
      var res = await fetch(apiBase() + '/api/auth/refresh', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ refresh_token: refresh }),
      });
      var data = await readJson(res);
      if (res.ok && data.access_token) {
        finish(data, get('gb-email'));
        return;
      }
    } catch (e) {}
    try {
      localStorage.removeItem('gb-access-token');
      localStorage.removeItem('gb-refresh-token');
    } catch (e) {}
    msg.textContent = 'Session expired. Enter the team password.';
  })();

  async function signIn() {
    var username = document.getElementById('user').value.trim();
    var password = document.getElementById('password').value;
    if (!username || !password) {
      msg.textContent = 'Enter username and password.';
      return;
    }
    go.disabled = true;
    msg.textContent = 'Signing in…';
    try {
      var res = await fetch(apiBase() + '/api/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username: username, password: password }),
      });
      var data = await readJson(res);
      if (!res.ok || !data.access_token) {
        msg.textContent = data.error || 'Invalid username or password';
        return;
      }
      finish(data, username);
    } catch (err) {
      msg.textContent = 'Could not reach the API. Wait a few seconds and try again.';
    } finally {
      go.disabled = false;
    }
  }

  go.addEventListener('click', signIn);
  document.getElementById('password').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') signIn();
  });
})();
</script>
</body>
</html>
