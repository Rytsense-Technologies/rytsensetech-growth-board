<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Growth Board</title>
<link rel="stylesheet" href="assets/site-nav.css">
<style>
  body { margin: 0; font-family: "Source Sans 3", system-ui, sans-serif; background: #f5f6f8; color: #12181f; }
  main { max-width: 420px; margin: 48px auto; background: #fff; border: 1px solid #e2e5ea; border-radius: 12px; padding: 20px; }
  label { display: block; font-size: 12px; margin: 10px 0 4px; }
  input, button { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid #e2e5ea; }
  button { margin-top: 14px; background: #0e7a82; color: #fff; border: 0; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.7; cursor: wait; }
  p { font-size: 13px; color: #4b5563; }
  details { margin-top: 16px; font-size: 12px; color: #6b7280; }
  details summary { cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Sign in</h1>
  <p>Use your Growth Board email and password. This browser stays signed in so you do not enter them on every visit.</p>
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">
  <button id="go" type="button">Sign in</button>
  <p id="msg"></p>
  <details>
    <summary>Technical settings</summary>
    <label for="apibase">Growth Board API URL</label>
    <input id="apibase" autocomplete="off">
  </details>
</main>
<script src="assets/app-config.js"></script>
<script src="assets/live-api.js"></script>
<script>
(function () {
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');
  var cfg = window.GB_CONFIG || {};
  var DEFAULT_API = (cfg.apiBase || (location.hostname === 'localhost' || location.hostname === '127.0.0.1'
    ? 'http://localhost:8787'
    : 'https://rytsensetech-growth-board.onrender.com')).replace(/\/$/, '');

  function get(key) {
    try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
  }
  function set(key, value) {
    try { if (value) localStorage.setItem(key, value); } catch (e) {}
  }
  function apiBase() {
    return (document.getElementById('apibase').value.trim() || DEFAULT_API).replace(/\/$/, '');
  }
  function nextPage() {
    try {
      var next = new URLSearchParams(location.search).get('next') || '';
      if (next && next.indexOf('://') < 0 && next.indexOf('//') !== 0) {
        if (next.charAt(0) === '/' || /^\w[\w.-]*\.html(\?|#|$)/.test(next)) return next;
      }
      if (document.referrer) {
        var ref = new URL(document.referrer);
        if (ref.origin === location.origin) {
          var leaf = ref.pathname.split('/').pop() || 'index.html';
          if (leaf && leaf !== 'login.html') return leaf + (ref.search || '') + (ref.hash || '');
        }
      }
    } catch (e) {}
    return 'index.html';
  }
  function finish(data, email) {
    if (window.GbLive && window.GbLive.saveSession) window.GbLive.saveSession(data);
    else {
      set('gb-access-token', data.access_token);
      set('gb-refresh-token', data.refresh_token);
    }
    set('gb-email', email || (data.user && data.user.email) || get('gb-email'));
    set('gb-api-base', apiBase());
    location.replace(nextPage());
  }
  async function readJson(res) {
    try { return await res.json(); } catch (e) { return {}; }
  }

  document.getElementById('apibase').value = get('gb-api-base') || DEFAULT_API;
  document.getElementById('email').value = get('gb-email');

  (async function () {
    var refresh = get('gb-refresh-token');
    if (!refresh) {
      try { localStorage.removeItem('gb-access-token'); } catch (e) {}
      return;
    }
    msg.textContent = 'Signing you in…';
    try {
      var res = await fetch(apiBase() + '/api/auth/refresh', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ refresh_token: refresh }),
      });
      var data = await readJson(res);
      if (res.ok && data.access_token) {
        finish(data, get('gb-email'));
        return;
      }
    } catch (e) {}
    try {
      localStorage.removeItem('gb-access-token');
      localStorage.removeItem('gb-refresh-token');
    } catch (e) {}
    msg.textContent = 'Session expired. Enter your password.';
  })();

  async function signIn() {
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    if (!email || !password) {
      msg.textContent = 'Enter email and password.';
      return;
    }
    go.disabled = true;
    msg.textContent = 'Signing in… the API may take a few seconds if it was asleep.';
    try {
      var res = await fetch(apiBase() + '/api/auth/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email: email, password: password }),
      });
      var data = await readJson(res);
      if (!res.ok || !data.access_token) {
        msg.textContent = data.error || data.error_description || data.msg || 'Sign-in failed';
        return;
      }
      finish(data, email);
    } catch (err) {
      msg.textContent = 'Could not reach the API. Wait a few seconds and try again.';
    } finally {
      go.disabled = false;
    }
  }

  go.addEventListener('click', signIn);
  document.getElementById('password').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') signIn();
  });
})();
</script>
</body>
</html>
