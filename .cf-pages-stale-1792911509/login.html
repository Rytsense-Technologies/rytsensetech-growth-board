<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Growth Board</title>
<link rel="stylesheet" href="assets/site-nav.css">
<style>
  body { margin: 0; font-family: "Source Sans 3", system-ui, sans-serif; background: #f5f6f8; color: #12181f; }
  main { max-width: 420px; margin: 48px auto; background: #fff; border: 1px solid #e2e5ea; border-radius: 12px; padding: 20px; }
  label { display: block; font-size: 12px; margin: 10px 0 4px; }
  input, button { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid #e2e5ea; }
  button { margin-top: 14px; background: #0e7a82; color: #fff; border: 0; font-weight: 700; }
  p { font-size: 13px; color: #4b5563; }
</style>
</head>
<body>
<main>
  <h1>Sign in</h1>
  <p>Client and superadmin use the same page. Role comes from membership.</p>
  <label for="url">Supabase URL</label>
  <input id="url" autocomplete="off">
  <label for="anon">Supabase anon key</label>
  <input id="anon" autocomplete="off">
  <label for="email">Email</label>
  <input id="email" type="email">
  <label for="password">Password</label>
  <input id="password" type="password">
  <button id="go" type="button">Sign in</button>
  <p id="msg"></p>
</main>
<script type="module">
  const msg = document.getElementById('msg');
  document.getElementById('go').onclick = async () => {
    const url = document.getElementById('url').value.trim();
    const anon = document.getElementById('anon').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const res = await fetch(url + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: anon, 'content-type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) { msg.textContent = data.error_description || data.msg || 'Sign-in failed'; return; }
    localStorage.setItem('gb-access-token', data.access_token);
    localStorage.setItem('gb-api-base', location.origin.includes('localhost') ? 'http://localhost:8787' : localStorage.getItem('gb-api-base') || '');
    msg.textContent = 'Signed in. Open the Growth Board.';
  };
</script>
</body>
</html>
