# Page Speed Insights — once a week on Monday.
#   Monday 03:00 UTC (08:30 IST): batch POST /api/jobs/psi-sync then POST /api/jobs/psi-tasks
# Render's proxy 502s a single all-pages request around 11 minutes, so GitHub drives
# 6-page slices (each finishes well under that) until done, then creates Dev tasks.
# Scores stay in Postgres until the next Monday. The board reads that stored scan.
#
# One-time setup in GitHub repo Settings → Secrets and variables → Actions:
#   GB_API_BASE  — public HTTPS URL of the Express API (no trailing slash)
#   CRON_SECRET  — same value as CRON_SECRET on the API host
#
# Until Express is hosted, run locally instead:
#   npm run api   (leave it running)
#   npm run psi:weekly

name: PSI jobs

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [psi-weekly, psi-sync, psi-tasks]
        default: psi-weekly

concurrency:
  group: psi-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Call API
        env:
          GB_API_BASE: ${{ secrets.GB_API_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event_name == 'workflow_dispatch' && inputs.job || 'psi-weekly' }}
        run: |
          if [ -z "$GB_API_BASE" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::GB_API_BASE / CRON_SECRET secrets not set; skipping"
            exit 0
          fi
          if [ "$JOB" = "psi-weekly" ]; then
            OFFSET=0
            LIMIT=6
            while true; do
              echo "PSI sync batch offset=$OFFSET limit=$LIMIT"
              RESP=$(curl --fail-with-body --silent --show-error --max-time 600 \
                -X POST "$GB_API_BASE/api/jobs/psi-sync" \
                -H "x-cron-secret: $CRON_SECRET" \
                -H "content-type: application/json" \
                -d "{\"offset\":$OFFSET,\"limit\":$LIMIT}")
              echo "$RESP"
              DONE=$(echo "$RESP" | jq -r '.result.done // empty')
              NEXT=$(echo "$RESP" | jq -r '.result.nextOffset // empty')
              if [ "$DONE" = "true" ]; then
                break
              fi
              if [ -z "$NEXT" ] || [ "$NEXT" = "null" ] || [ "$NEXT" = "$OFFSET" ]; then
                echo "batch did not advance (nextOffset=$NEXT)" >&2
                exit 1
              fi
              OFFSET=$NEXT
            done
            echo "PSI tasks"
            curl --fail-with-body --silent --show-error --max-time 180 \
              -X POST "$GB_API_BASE/api/jobs/psi-tasks" \
              -H "x-cron-secret: $CRON_SECRET" \
              -H "content-type: application/json" \
              -d '{}'
          else
            curl --fail-with-body --silent --show-error --max-time 600 \
              -X POST "$GB_API_BASE/api/jobs/$JOB" \
              -H "x-cron-secret: $CRON_SECRET" \
              -H "content-type: application/json" \
              -d '{}'
          fi
