name: Refresh dashboard data

on:
  schedule:
    # 02:30 UTC = 08:00 IST, daily
    - cron: '30 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run fetch-data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}

      - name: Commit refreshed data
        run: |
          git config user.name "growth-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "chore: refresh dashboard data [skip ci]"
          git push
