</style>

<script src="assets/board-format.js"></script>
<script>
(function(){
  /* Formatters come from assets/board-format.js — this page used to carry its
     own esc/num/pct, and they had already drifted from the other four pages
     (report's pct() took a decimals argument, everyone else's was hardcoded to
     1dp, so the same CTR printed differently depending on the page you opened).
     esc() is unchanged in behaviour: every interpolated value still goes
     through it, which is why this app has no XSS. Do not regress that. */
  var esc=GB.esc, num=GB.num, pct=GB.pct, pos=GB.pos, NM=GB.NOT_MEASURED;

  function pendNote(extra){
    return '<div class="pendbar"><span class="pill">Pending</span><p class="note"><strong>These figures read &ldquo;'+esc(NM)+'&rdquo; because no data source is attached.</strong> Nothing here was measured — it is not a measured zero.'+(extra?' '+extra:'')+'</p></div>';
  }

  /* A standing caveat that is NOT conditional on the live sources.
     THE DEFECT (#3): this bar used to be printed by `if(!execLive)`, so the
     moment Search Console and GA4 started answering it disappeared — and
     "Leads: 0" and "Referring domains: 0" were left sitting in the same tile
     row as real clicks and sessions, with nothing left on screen to say that
     no CRM and no Ahrefs account have ever been connected. The sources that
     are not connected do not become connected because other ones are. */
  function notConnectedNote(sources){
    return '<div class="pendbar"><span class="pill">Not connected</span><p class="note"><strong>'+
      esc(sources.join(' and '))+' '+(sources.length>1?'are':'is')+' not connected.</strong> '+
      'Those tiles read &ldquo;'+esc(NM)+'&rdquo;, never 0 — nobody has wired the source up, so no '+
      'value exists to be zero.</p></div>';
  }

  /* Render a source’s own note (truncation, tool ceilings, caveats).
     gscByPage/gscByQuery/ga4ByPage each ship a `note` saying the rows were
     capped, and this page rendered none of them. */
  function sourceNote(text){
    if(!text) return '';
    return '<div class="pendbar"><span class="pill">Source note</span><p class="note">'+esc(text)+'</p></div>';
  }

  /* Audit findings carry the engagement window they came out of, the same way
     GSC/GA4 figures carry theirs. Plain text; the caller escapes. */
  function auditWindowOf(a){
    return (a&&a.auditedRange)?('audit '+a.auditedRange):'audit window not stated';
  }

  /* "GSC · Aug 30 – Sep 26" — the window a figure covers, printed beside it.
     gsc.period was in latest.json and was rendered on zero pages.
     Returns PLAIN text: the single caller escapes it. */
  function windowLine(source, period, updatedAt){
    var label=GB.periodLabel(period);
    if(!label) return source+' · window not stated in feed';
    return source+' · '+label+(GB.isProvisional(period, updatedAt)?' · last '+GB.GSC_LAG_DAYS+'d provisional':'');
  }

  /* One tile.
   *
   * THE DEFECT (#1): the pill used to read "Verified" whenever `live` was
   * truthy — and `live` was set from nothing more than "does this key exist in
   * latest.json" (`live:!!(g.current)`, `live:ok(section)`). Nothing on this
   * page verifies anything. The board stamped "Verified" on a corpus total
   * computed from a 30-row sample (#2) and on figures whose window it never
   * printed. A pill can state PROVENANCE — which source, which window. It
   * cannot state verification, so there is no longer a state that claims it.
   *
   * Three honest states:
   *   live    — the named source returned this figure in this sync
   *   pending — the source is wired but returned nothing this run
   *   none    — nobody has ever connected this source (CRM, Ahrefs, Ads)
   */
  function tile(opts){
    var st=opts.state||(opts.live?'live':'pending');
    var live=st==='live';
    var none=st==='none';
    var src=opts.source||'—';
    var value=none?NM:(opts.v==null||opts.v===''?NM:String(opts.v));
    var isNm=value===NM;
    var cls='tile '+(live?'is-live':'is-pending')+(opts.crit&&live?' is-crit':'')+(opts.good&&live?' is-good':'');
    var pill=live
      ?'<span class="srcpill sp-src">'+esc(src)+'</span>'
      :'<span class="srcpill sp-pend">'+esc(src+(none?' · not connected':' · pending'))+'</span>';
    var sub=opts.s||'';
    /* hasOwnProperty, not `!== undefined`: ga4 ships no `period` at all, and
       "window not stated in feed" is exactly the thing a reader needs told. */
    if(live&&Object.prototype.hasOwnProperty.call(opts,'period')){
      var w=windowLine(src,opts.period,opts.updatedAt);
      sub=sub?(sub+' · '+w):w;
    }
    else if(none&&!sub) sub='No value was retrieved — this is not a measured zero.';
    return '<div class="'+cls+'"><div class="k">'+esc(opts.k)+'</div><div class="v mono'+(isNm?' gb-nm':'')+'">'+esc(value)+'</div>'+
      (sub?'<div class="s">'+esc(sub)+'</div>':'')+pill+'</div>';
  }
  function scoreBar(score,max,mod){
    var m=max||5,s=Math.max(0,Math.min(m,+score||0));
    var html='<div class="scorebar '+(mod||'')+'">';
    for(var i=1;i<=m;i++) html+='<span'+(i<=s?' class="on"':'')+'></span>';
    return html+'</div>';
  }

  var state={audit:null,live:null,fixes:{items:[],source:'seed'},history:[]};

  /* —— Navigation / theme —— */
  function show(id){
    var btn=document.querySelector('.navbtn[data-tab="'+id+'"]');
    document.querySelectorAll('.wrap > section').forEach(function(sec){
      sec.hidden = sec.id!==id;
    });
    document.querySelectorAll('.navbtn').forEach(function(b){
      b.setAttribute('aria-current', b===btn?'true':'false');
    });
    if(btn){
      document.getElementById('page-title').textContent=btn.textContent.trim();
    }
    try{localStorage.setItem('rts-tab',id)}catch(e){}
    document.getElementById('wrap').scrollIntoView({block:'start'});
    closeSide();
  }

  function openSide(){
    document.getElementById('side').classList.add('open');
    var s=document.getElementById('scrim');
    s.hidden=false; s.classList.add('on');
  }
  function closeSide(){
    document.getElementById('side').classList.remove('open');
    var s=document.getElementById('scrim');
    s.classList.remove('on'); s.hidden=true;
  }

  document.getElementById('hamb').addEventListener('click', openSide);
  document.getElementById('scrim').addEventListener('click', closeSide);
  document.querySelectorAll('.navbtn').forEach(function(b){
    b.addEventListener('click', function(){ show(b.getAttribute('data-tab')); });
  });

  document.getElementById('theme-btn').addEventListener('click', function(){
    var cur=document.documentElement.dataset.theme||'';
    var next=cur===''?'light':(cur==='light'?'dark':'');
    if(next) document.documentElement.dataset.theme=next;
    else delete document.documentElement.dataset.theme;
    try{localStorage.setItem('rts-theme', next||'system')}catch(e){}
  });

  /* —— Audit sections —— */
  function renderSummary(a){
    var b=a.baselines||{};
    /* Audit figures are findings from a dated manual engagement, not a live
       measurement — so they name that engagement's window, same as the GSC and
       GA4 tiles name theirs. `Audit` is the source; nothing here is "Verified". */
    var auditWindow=auditWindowOf(a);
    var html='<p class="lede">'+esc(a.verdict.summary)+'</p>';
    html+='<div class="tiles four">'+
      tile({k:'Critical',v:a.verdict.criticalCount,live:true,crit:true,source:'Audit',s:'Open blockers · '+auditWindow})+
      tile({k:'High',v:a.verdict.highCount,live:true,source:'Audit',s:'Priority defects · '+auditWindow})+
      tile({k:'URLs audited',v:num(a.pageInventory.totalUrls),live:true,source:'Audit',s:auditWindow})+
      tile({k:'US top-10 queries',v:b.usCommercialQueriesInTop10,live:true,crit:true,source:'Audit',s:'Commercial set · '+auditWindow})+
      '</div>';
    html+='<div class="h2">Dimension scores</div><div class="tiles">';
    a.scores.forEach(function(s){
      var mod=s.score<=2?'c':(s.score>=4?'g':'');
      html+='<div class="tile is-live"><div class="k">'+esc(s.dimension)+'</div>'+
        '<div class="v mono" style="font-size:20px">'+(s.score)+'<span style="font-size:12px;color:var(--ink-3)">/'+s.max+'</span></div>'+
        scoreBar(s.score,s.max,mod)+'<span class="srcpill sp-src">Audit</span></div>';
    });
    html+='</div>';
    html+='<div class="h2">Baselines</div><div class="tiles four">'+
      tile({k:'Blog posts',v:num(b.blogPosts),live:true,source:'Audit',s:auditWindow})+
      tile({k:'US service pages',v:num(b.usServicePages),live:true,source:'Audit',s:auditWindow})+
      /* `(x||0)*100` turned a missing rate into a measured 0.0%. Pass null. */
      tile({k:'AI cite non-brand',v:pct(b.aiCitationRateNonBranded==null?null:b.aiCitationRateNonBranded*100),live:true,source:'Audit',s:auditWindow})+
      tile({k:'SoV vs LeewayHertz',v:b.aiShareOfVoiceVsLeewayHertz,live:true,source:'Audit',s:auditWindow})+
      '</div>';
    document.getElementById('summary').innerHTML=html;
  }

  function renderCritical(a){
    var html='<p class="lede">Findings verified during the '+esc(a.auditedRange)+' engagement. Critical items block trustworthy AI citation and SERP conversion.</p>';
    a.criticalIssues.forEach(function(i){
      html+='<article class="find crit"><h4>'+esc(i.title)+' <span class="tag t-crit">'+esc(i.id)+'</span> <span class="tag t-sig">'+esc(i.scope)+'</span></h4>'+
        '<p>'+esc(i.detail)+'</p></article>';
    });
    a.highIssues.forEach(function(i){
      html+='<article class="find warn"><h4>'+esc(i.title)+' <span class="tag t-warn">'+esc(i.id)+'</span></h4>'+
        '<p>'+esc(i.detail)+'</p></article>';
    });
    document.getElementById('critical').innerHTML=html;
  }

  function renderWins(a){
    var html='<p class="lede">Fifteen shippable actions with owner and effort. Prefer W1–W5 this sprint.</p>';
    html+='<div class="h2">Ship today</div><div class="tblwrap"><table><thead><tr><th>ID</th><th>Action</th><th>Location</th><th>Effort</th><th>Owner</th></tr></thead><tbody>';
    a.easyWins.forEach(function(w){
      html+='<tr><td class="u">'+esc(w.id)+'</td><td>'+esc(w.action)+'<div style="font-size:11.5px;color:var(--ink-3);margin-top:3px">'+esc(w.rationale)+'</div></td>'+
        '<td>'+esc(w.location)+'</td><td class="n">'+esc(w.effort)+'</td><td>'+esc(w.owner)+'</td></tr>';
    });
    html+='</tbody></table></div>';
    document.getElementById('wins').innerHTML=html;
  }

  function renderMoves(){
    var html='<p class="lede">Sequence that unblocks the rest of the programme. Do not parallelize past step 1 until wrong-host signals stop leaking.</p>';
    html+='<div class="card"><div class="kv"><span>1 · Stop authority leaks</span><span class="val">Canonical + host 301s</span></div>'+
      '<div class="kv"><span>2 · Make entity facts singular</span><span class="val">Headcount / cities / projects</span></div>'+
      '<div class="kv"><span>3 · Connect content to money</span><span class="val">118 blog → /us/ services</span></div></div>';
    html+='<div class="h2">Why this order</div><div class="modlist">'+
      '<span><b>Trust</b>Fake review schema and conflicting facts poison AEO first.</span>'+
      '<span><b>Index</b>Wrong-host canonicals split US/global signals.</span>'+
      '<span><b>Demand</b>Blog equity does not convert until hub links exist.</span></div>';
    document.getElementById('moves').innerHTML=html;
  }

  function renderCompetitive(a){
    var max=Math.max.apply(null,a.competitiveBenchmark.map(function(d){return d.serps||0}))||1;
    var html='<p class="lede">SERP presence vs named competitors on the US commercial set used in the Sep engagement.</p>';
    html+='<div class="tblwrap"><table><thead><tr><th>Domain</th><th class="n">SERPs</th><th></th><th class="n">Avg pos</th><th class="n">AI cites</th></tr></thead><tbody>';
    a.competitiveBenchmark.forEach(function(d){
      var avg=d.avgPosition==null?'—':Number(d.avgPosition).toFixed(1);
      var w=((d.serps||0)/max*100).toFixed(1);
      html+='<tr><td>'+esc(d.domain)+(d.onClientList?' <span class="tag t-sig">you</span>':'')+'</td>'+
        '<td class="n">'+(d.serps||0)+'</td><td style="min-width:120px"><div class="bar'+(d.onClientList?' c':'')+'"><i style="width:'+w+'%"></i></div></td>'+
        '<td class="n">'+avg+'</td><td class="n">'+(d.aiCitations||0)+'</td></tr>';
    });
    html+='</tbody></table></div>';
    document.getElementById('competitive').innerHTML=html;
  }

  function renderTechnical(a){
    var th=a.technicalHealth;
    var html='<p class="lede">'+th.passing+'/'+th.totalChecks+' checks passing · '+th.failing+' failing.</p>';
    html+='<div class="tiles four">'+
      tile({k:'Passing',v:th.passing,live:true,good:true,source:'Audit',s:auditWindowOf(a)})+
      tile({k:'Failing',v:th.failing,live:true,crit:true,source:'Audit',s:auditWindowOf(a)})+
      tile({k:'Warn',v:th.checks.filter(function(c){return c.status==='warn'}).length,live:true,source:'Audit',s:auditWindowOf(a)})+
      tile({k:'Total',v:th.totalChecks,live:true,source:'Audit',s:auditWindowOf(a)})+
      '</div><div class="h2">Checks</div><div class="stack">';
    th.checks.forEach(function(c){
      var sev=c.status==='fail'?'crit':(c.status==='warn'?'warn':'good');
      var tag=c.status==='fail'?'t-crit':(c.status==='warn'?'t-warn':'t-good');
      html+='<article class="find '+sev+'"><h4>'+esc(c.name)+' <span class="tag '+tag+'">'+esc(c.status)+'</span> <span class="tag t-info">'+esc(c.id)+'</span></h4>'+
        (c.note?'<p>'+esc(c.note)+'</p>':'')+'</article>';
    });
    html+='</div>';
    document.getElementById('technical').innerHTML=html;
  }

  function renderAi(a){
    var live=a.aiAccuracyErrors.filter(function(e){return e.live!==false});
    var html='<p class="lede">Factual errors models currently repeat when prompted about Rytsense. Fix on-page facts before chasing more citations.</p>';
    live.forEach(function(e){
      var sev=e.severity==='high'?'crit':(e.severity==='medium'?'warn':'info');
      var tag=sev==='crit'?'t-crit':(sev==='warn'?'t-warn':'t-info');
      html+='<article class="find '+sev+'"><h4>'+esc(e.error)+' <span class="tag '+tag+'">'+esc(e.id)+'</span> <span class="tag t-pend">'+esc(e.severity)+'</span></h4>'+
        '<p>Source: '+esc(e.source)+'</p></article>';
    });
    html+='<div class="h2">Off-site citation targets</div><div class="modlist">';
    a.offsiteTargets.forEach(function(o){
      html+='<span><b>'+esc(o.domain)+'</b>'+esc(o.why)+'</span>';
    });
    html+='</div>';
    document.getElementById('ai').innerHTML=html;
  }

  function renderInventory(a){
    var inv=a.pageInventory;
    var max=Math.max.apply(null,inv.segments.map(function(s){return s.urls}))||1;

  /* —— Modules —— */
  function ok(sec){return sec&&sec.status==='ok'}

  function renderModules(){
    var L=state.live||{};

    var g=L.gsc||{}, ga=L.ga4||{};
    var syncedAt=L.updatedAt;

    var hex='<p class="lede">Organic pulse from the daily growth-board refresh. Leads and backlinks have no vendor attached at all.</p>';

    hex+=notConnectedNote(['CRM (leads)','Ahrefs (referring domains)']);
    if(!execLive) hex+=pendNote();
    hex+='<div class="h2">Metrics</div><div class="tiles four">'+
      tile({k:'Clicks 28d',v:num(g.current&&g.current.clicks),live:!!(g.current),source:'GSC',period:gPeriod,updatedAt:syncedAt,s:g.change&&g.change.clicksPercent!=null?((g.change.clicksPercent>0?'+':'')+pct(g.change.clicksPercent)+' vs prior'):'',crit:!!(g.change&&g.change.clicksPercent<=-15)})+
      tile({k:'Impressions',v:num(g.current&&g.current.impressions),live:!!(g.current),source:'GSC',period:gPeriod,updatedAt:syncedAt})+
      tile({k:'CTR',v:g.current?pct(g.current.ctr):NM,live:!!(g.current),source:'GSC',period:gPeriod,updatedAt:syncedAt})+
      tile({k:'Avg position',v:pos(g.current&&g.current.position),live:!!(g.current),source:'GSC',period:gPeriod,updatedAt:syncedAt})+
      tile({k:'Sessions',v:num(ga.totals&&ga.totals.sessions),live:!!(ga.totals),source:'GA4',period:gaPeriod,updatedAt:syncedAt})+
      tile({k:'Organic Search',v:num(chFind('Organic Search')),live:ch.length>0,source:'GA4',period:gaPeriod,updatedAt:syncedAt})+
      /* NOT 0. No CRM and no Ahrefs account have ever been connected, so there

      tile({k:'Leads',state:'none',source:'CRM'})+
      tile({k:'Referring domains',state:'none',source:'Ahrefs'})+

    document.getElementById('m-exec').innerHTML=hex;

    function moduleShell(id, lede, liveSec, sourceName, tilesHtml, listsHtml){

      document.getElementById(id).innerHTML=h;
    }

    var geo=L.gscByCountry, gaGeo=L.ga4ByCountry;
    var geoLive=ok(geo)||ok(gaGeo);
    setNavState('m-geo', geoLive?'good':'pend');
    var geoH='<p class="lede">US vs rest-of-world rollups for Search Console and GA4.</p>';
    if(!geoLive) geoH+=pendNote('Needs <strong>gscByCountry</strong> / <strong>ga4ByCountry</strong> from the daily Claude refresh.');
    geoH+='<div class="h2">Metrics</div><div class="tiles four">'+
      tile({k:'GSC US clicks',v:num(geo&&geo.us&&geo.us.clicks),live:ok(geo),source:'GSC',period:gPeriod,updatedAt:syncedAt})+
      tile({k:'GSC rest clicks',v:num(geo&&geo.global&&geo.global.clicks),live:ok(geo),source:'GSC',period:gPeriod,updatedAt:syncedAt})+

    document.getElementById('m-geo').innerHTML=geoH;

    var pages=L.gscByPage;
    /* THE DEFECT (#2): gscByPage publishes 30 of ~500 rows and says so in its
       own `note` ("GitHub push capped at top 30 of 500 rows"). That note was
       rendered on no page, the table was headed "Top pages" as if it were the
       whole corpus, and a site-wide count was computed over it (see m-content).

    var pagesSample=GB.sampleInfo(pages);
    var pagesLabel=GB.sampleLabel(pagesSample);
    setNavState('m-page', ok(pages)?'good':'pend');
    var pageH='<p class="lede">Top URLs by impressions with GA4 sessions join when both sides are present.</p>';

    else {

      pageH+='<div class="h2">Top pages'+(pagesLabel?'<span class="gb-sample">'+esc(pagesLabel)+'</span>':'')+'</div>'+

      (pages.rows||[]).slice(0,25).forEach(function(r){
        pageH+='<tr><td class="u">'+esc(r.page)+'</td><td class="n">'+num(r.impressions)+'</td><td class="n">'+num(r.clicks)+'</td><td class="n">'+pct(r.ctr)+'</td><td class="n">'+pos(r.position)+'</td></tr>';

    if(!ok(pages)) pageH+='<div class="h2">Metrics</div><div class="tiles four">'+tile({k:'Pages tracked',live:false,source:'GSC'})+tile({k:'With sessions',live:false,source:'GA4'})+'</div>';

    var qw=(g.quickWins)||[];

    var qSample=GB.sampleInfo(L.gscByQuery);
    var qLabel=GB.sampleLabel(qSample);
    setNavState('m-kw', (fullQ||qw.length)?'good':'pend');

    var rows=fullQ?(L.gscByQuery.rows||[]):qw;
    var buckets=fullQ&&L.gscByQuery.buckets?L.gscByQuery.buckets:{'1':0,'2-3':0,'4-5':0,'6-10':0,'11-20':0,'21-50':0,'51-100':0};
    if(!fullQ) rows.forEach(function(r){var p=r.position||99;var b=p<=1?'1':p<=3?'2-3':p<=5?'4-5':p<=10?'6-10':p<=20?'11-20':p<=50?'21-50':'51-100';buckets[b]=(buckets[b]||0)+1});

    var inv=a.pageInventory||{};

    if(!contentLive) cH+=pendNote();

    /* THE DEFECT (#2), where it actually misled people.
     *
     * This tile read:
     *   num(gscByPage.rows.filter(<is content URL> && impressions > 0).length)
     * over gscByPage.rows — which is 30 rows out of ~500, by the data's own
     * note — and presented the result as "Content URLs w/ impressions", a
     * corpus-wide total, under a pill that said "Verified". It was wrong by
     * roughly an order of magnitude and looked authoritative.
     *
     * You cannot recover a site-wide count from a top-N sample, so this no
     * longer tries. When the sample is truncated the tile reports NOT_MEASURED
     * and says what would be needed; the sample-scoped count is shown as a

    var contentRe=/\/(blog|case-stud|resource)/i;

    if(ok(aiT)){

      (aiT.rows||[]).forEach(function(r){aiH+='<tr><td>'+esc(r.referrer)+'</td><td class="n">'+num(r.sessions)+'</td><td class="n">'+num(r.activeUsers)+'</td></tr>'});

    if(L.clarity&&L.clarity.status!=='ok') alerts.push({sev:'warn',t:'Clarity not reporting'});

    setNavState('m-alerts', alerts.some(function(x){return x.sev==='crit'})?'crit':'good');
    var alH='<p class="lede">Rules evaluated against latest.json + audit critical count.</p><div class="stack">';

    });

    document.getElementById('m-alerts').innerHTML=alH;

    setNavState('m-leads','pend');

    setNavState('m-ads','pend');
    document.getElementById('m-ads').innerHTML='<p class="lede">Paid search blend with organic for CAC views.</p>'+notConnectedNote(['Google Ads / Bing Ads'])+
      '<div class="h2">Metrics</div><div class="tiles four">'+tile({k:'Paid clicks',state:'none',source:'Ads'})+tile({k:'Spend',state:'none',source:'Ads'})+tile({k:'CPA',state:'none',source:'Ads'})+tile({k:'Brand vs non-brand',state:'none',source:'Ads'})+'</div>';

    /* sources */
    setNavState('m-sources','good');
    var src=(a.sourceStatus)||[];
    var sH='<p class="lede">Connection status for the growth-board data plane. Live sources feed the dashboard modules above.</p>';
    sH+='<div class="h2">Connection status</div><div class="tblwrap"><table><thead><tr><th>Source</th><th>Status</th><th>Note</th></tr></thead><tbody>';
    src.forEach(function(s){
      var tag=s.status==='live'?'t-good':'t-pend';
      sH+='<tr><td>'+esc(s.name)+'</td><td><span class="tag '+tag+'">'+esc(s.status)+'</span></td><td>'+esc(s.note||'')+'</td></tr>';
    });
    sH+='</tbody></table></div>';
    document.getElementById('m-sources').innerHTML=sH;
  }

  /* —— Fixes handlers —— */
  function persistLocal(){try{localStorage.setItem('gb-fixes-v1',JSON.stringify(state.fixes.items))}catch(e){}}
  function mergeLocal(seed){
    var map={}; (seed||[]).forEach(function(i){map[i.id]=Object.assign({},i)});
    try{var raw=localStorage.getItem('gb-fixes-v1'); if(raw) JSON.parse(raw).forEach(function(i){if(map[i.id]){map[i.id].done=!!i.done;map[i.id].doneAt=i.doneAt;map[i.id].doneBy=i.doneBy}})}catch(e){}
    return Object.keys(map).map(function(k){return map[k]});
  }

  document.getElementById('wrap').addEventListener('change', async function(ev){
    if(!ev.target.matches('#fixes-list input[type=checkbox]')) return;
    var row=ev.target.closest('.fix-row'); var id=row&&row.getAttribute('data-id'); if(!id) return;
    var item=state.fixes.items.find(function(i){return i.id===id}); if(!item) return;
    item.done=!!ev.target.checked; item.doneAt=item.done?new Date().toISOString():null; item.doneBy=item.done?'dashboard':null;
    renderFixes(); persistLocal();
    if(state.fixes.source==='api'){
      try{await fetch('/api/fixes/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:item.done,doneBy:'dashboard'})})}catch(e){}
    }
  });

  async function loadHistory(){
    var dates=[];
    try{var m=await fetch('data/history/index.json',{cache:'no-store'}); if(m.ok){var j=await m.json(); dates=j.dates||[]}}catch(e){}
    if(!dates.length) dates=['2026-09-18','2026-09-19'];
    var out=[];
    for(var i=0;i<dates.length;i++){
      try{var r=await fetch('data/history/'+dates[i]+'.json',{cache:'no-store'}); if(r.ok) out.push(await r.json())}catch(e){}
    }
    return out.sort(function(a,b){return String(a.date).localeCompare(String(b.date))});
  }

  Promise.all([
    /* GB.fetchJson throws a readable message instead of piping a 404 HTML error
       page into r.json() and failing with "Unexpected token <". */
    GB.fetchJson('data/audit.json'),
    GB.loadJson('data/fixes.json', {items:[]}),
    GB.loadJson('data/latest.json', {}),
    loadHistory(),
    GB.loadJson('/api/fixes', null)
  ]).then(function(pair){
    state.audit=pair[0]; state.live=pair[2]||{}; state.history=pair[3];
    if(pair[4]&&pair[4].items){ state.fixes={items:pair[4].items,source:'api'}; }
    else { state.fixes={items:mergeLocal((pair[1]||{}).items||[]),source:'local'}; }

    /* TWO clocks, and the page used to print only the first. `updatedAt` is
       when the refresh job ran; the GSC window's end date is what the numbers
       actually cover, and they sit 2-3 days apart because Search Console
       finalises late. Both, plus the audit's own window. */
    var gscPeriod=state.live.gsc&&state.live.gsc.period;
    document.getElementById('page-meta').textContent=
      'Audited '+(state.audit.auditedRange||'range not stated')+
      ' · Live sync '+(state.live.updatedAt?GB.fmtDate(state.live.updatedAt):'not stated in feed')+
      ' · GSC data '+(GB.asOf(gscPeriod)||'coverage not stated in feed')+
      (GB.isProvisional(gscPeriod, state.live.updatedAt)?' (last '+GB.GSC_LAG_DAYS+'d provisional)':'');

    renderSummary(state.audit);
    renderCritical(state.audit);
    renderWins(state.audit);
    renderMoves();
    renderCompetitive(state.audit);
    renderTechnical(state.audit);
    renderAi(state.audit);
    renderInventory(state.audit);
    renderMoney(state.audit);
    renderFixes();
    renderModules();

    var tab='summary';
    try{ tab=localStorage.getItem('rts-tab')||'summary'; }catch(e){}
    if(!document.getElementById(tab)) tab='summary';
    show(tab);
  }).catch(function(err){
    document.getElementById('page-meta').textContent='Failed to load: '+err.message;
  });
})();
</script>
</body>
</html>
